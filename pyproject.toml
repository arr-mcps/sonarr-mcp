[project]
name = "sonarr-mcp"
version = "0.2.0"
description = "MCP server for Sonarr's v3 API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1.4"]

[project.scripts]
sonarr-mcp = "sonarr_mcp:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Sonarr instance (needs SONARR_URL/SONARR_API_KEY)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
